name: miqat
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  
  cupertino_icons: ^1.0.8
  dio: ^5.9.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.3
  font_awesome_icon_class: ^0.0.6
  go_router: ^17.3.0
  google_generative_ai: ^0.4.7
  json_annotation: ^4.9.0
  
  lottie: ^3.3.1
  retrofit: ^4.9.2
  
  skeletonizer: ^2.1.2
  
  flutter_localizations:
    sdk: flutter
  animated_bottom_navigation_bar: ^1.4.0
  smooth_page_indicator: ^2.0.1
  isar_community: ^3.3.2
  font_awesome_flutter: ^10.10.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  path_provider: ^2.1.6
  get_it: ^9.2.1
  isar_community_flutter_libs: ^3.3.2
  audio_video_progress_bar: ^2.0.3
  just_audio: ^0.10.6
  media_store_plus: ^0.1.3
  geolocator: ^14.0.3
  flutter_device_compass: ^2.0.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  audio_service: ^0.18.19
  freezed: ^3.2.5
  freezed_annotation: ^3.1.0
  

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "asset/image/main_logo.png"
  min_sdk_android: 21
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  build_runner: ^2.10.5
  isar_community_generator: ^3.3.2
  json_serializable: ^6.11.4
  retrofit_generator: ^10.2.1
  flutter_launcher_icons: ^0.14.4



# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - asset/image/
    - asset/audio/
    - asset/json/
    - asset/json/quran/
    - asset/json/quran/svg/
    - asset/anim/
    - asset/json/azkar/
    - asset/image/svg/
    - asset/audio/adhan/
    - asset/image/azkar/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images
  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package
  fonts:
    - family: Cairo
      fonts:
        - asset: asset/font/Cairo-Bold.ttf
          weight: 700

        - asset: asset/font/Cairo-Medium.ttf
          weight: 500

        - asset: asset/font/Cairo-Regular.ttf
          weight: 400

        - asset: asset/font/Cairo-SemiBold.ttf
          weight: 600
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
flutter_intl:
  enabled: true
